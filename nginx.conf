# Clearance frontend static server (used by the root Dockerfile).
# SPA fallback: every non-file path serves index.html so react-router
# deep links resolve client-side. Port 8080 matches the Vite dev origin
# (vite.config.ts) and the compose/backend CLIENT_URL default.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Chrome requires application/manifest+json or it ignores the manifest
  # entirely, and .webmanifest is absent from nginx's default mime map
  # (it falls through to application/octet-stream). default_type only applies
  # to unmatched extensions, so the inherited map for .ico/.png/.js survives.
  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # pdf.js's worker is an ES module (.mjs). The base image's mime map does not
  # include mjs, so without this it is served as application/octet-stream and
  # the browser refuses to instantiate it as a module worker.
  location ~* \.mjs$ {
    default_type text/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
