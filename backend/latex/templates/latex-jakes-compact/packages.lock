// Clearance resume template: latex-jakes-compact
// TEMPLATE LOCKFILE - this template's own record of what it depends on.
//
// The engine is TeX Live, shipped INSIDE the pinned worker image rather than vendored
// as an archive. `engine.latex.version` is the same value as LATEX_PIN.version in
// backend/src/render/sandbox.ts; a mismatch is RENDER_TOOLCHAIN_MISMATCH at registry load.
//
// No `font.faces.*` records: this variant uses the image's default Computer Modern faces
// and loads no font package beyond T1 `fontenc`. No packages are imported. The body is
// generated by `latexExport.ts` variant `jakes-compact`; `template.tex` is a reviewed
// marker, not the compiled document.

template.id          = latex-jakes-compact
template.version     = 1.0.0

engine.latex.version = 2022
engine.latex.license = LPPL-1.3c

thirdPartyPackages.count = 0
packages.count = 0
